# TrinityGuard Default Configuration
# Non-sensitive defaults only. API keys go in .env

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  api_key_env: "MAS_LLM_API_KEY"

logging:
  level: "INFO"
  test_log_dir: "logs/tests"

testing:
  timeout: 300
  use_dynamic_cases: false
  consensus_n: 3          # Number of judge samples for consensus

monitoring:
  buffer_size: 1000
  alert_threshold: 3
