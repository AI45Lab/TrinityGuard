# config/llm_profiles.yaml
profiles:
  # DeepSeek R1（在线推理模型）
  deepseek_r1:
    provider: "deepseek"
    model: "deepseek-reasoner"
    api_key: "sk-6c1bddcc55e54d8d95b38ee3734b121e"
    base_url: "https://api.deepseek.com/v1"
    temperature: 1        # R1 官方推荐 temperature=1
    max_tokens: 8000
    timeout: 120          # R1 推理时间长，需要更长超时

  # DeepSeek Chat（普通对话模型，速度快）
  deepseek_chat:
    provider: "deepseek"
    model: "deepseek-chat"
    api_key: "sk-6c1bddcc55e54d8d95b38ee3734b121e"
    base_url: "https://api.deepseek.com/v1"
    temperature: 0
    max_tokens: 4096
    timeout: 20
    retry_count: 1

  # OpenAI GPT-4o
  gpt4o:
    provider: "openai"
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0
    max_tokens: 4096
    timeout: 30

  # OpenAI GPT-4o-mini（低成本）
  gpt4o_mini:
    provider: "openai"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0
    max_tokens: 4096
    timeout: 30